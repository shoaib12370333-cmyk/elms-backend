<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELMS Importer</title><style>
body{font-family:Arial,sans-serif;width:350px;margin:0;padding:16px;background:#f7f8fa;color:#111827}h2{margin:0 0 6px;font-size:18px}.hint{font-size:12px;color:#6b7280;line-height:1.4;margin-bottom:12px}.field{margin:10px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d1d5db;border-radius:7px}button{width:100%;padding:10px;border:0;border-radius:7px;background:#111827;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}button.secondary{background:#e5e7eb;color:#111827}.status{margin-top:10px;font-size:12px;line-height:1.4;white-space:pre-wrap}.connected{color:#047857;font-weight:700}.notconnected{color:#b45309;font-weight:700}.preview{margin-top:10px;padding:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;line-height:1.4}.stats{color:#6b7280;margin-top:4px}.register-line{margin:10px 0 2px;text-align:center;font-size:12px;color:#6b7280}.register-line a{color:#2563eb;font-weight:700;text-decoration:none}.register-line a:hover{text-decoration:underline}.divider{margin:16px 0 4px;font-size:11px;color:#9ca3af;text-align:center;text-transform:uppercase;letter-spacing:.04em}
</style></head><body><h2>ELMS Amazon Importer</h2><div class="hint">Connect with your personal ELMS Extension Key. The extension imports clean product data directly into your ELMS Drafts.</div><div class="field"><label>ELMS Extension Key</label><input id="extensionKey" type="password" placeholder="elms_ext_..."></div><div class="field"><label>ELMS Backend URL</label><input id="backend" placeholder="https://your-api.example.com"></div><div class="field"><label>Markup % (optional)</label><input id="markup" type="number" step="0.01" placeholder="20"></div><button id="connect">Connect ELMS Account</button><div class="register-line">Don’t have an ELMS account? <a id="registerLink" href="#">Register now</a></div><button id="save" class="secondary">Save settings</button><button id="import">Import current Amazon product</button><div class="divider">or fetch by link — no need to open the page</div><div class="field"><label>Amazon Product Link</label><input id="amazonLink" placeholder="https://www.amazon.com/dp/..."></div><button id="fetchLink" class="secondary">Fetch by Link</button><div id="preview" class="preview" hidden></div><div id="status" class="status"></div><script src="popup.js"></script></body></html>
