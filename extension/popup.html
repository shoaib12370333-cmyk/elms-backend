<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELMS Amazon Importer</title>
<style>
:root{--navy:#101828;--blue:#2563eb;--indigo:#4f46e5;--cyan:#06b6d4;--muted:#667085;--line:#d9e2ef;--bg:#f5f8fc}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;width:350px;margin:0;padding:0;background:var(--bg);color:#101828}.header{padding:18px 18px 16px;background:linear-gradient(135deg,#2563eb 0%,#4f46e5 58%,#06b6d4 100%);color:#fff}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.16)}.brand-mark img{width:29px;height:29px;object-fit:contain}.brand-title{font-size:19px;font-weight:800}.header p{margin:7px 0 0;font-size:12px;line-height:1.4;opacity:.92}.body{padding:16px 15px 18px}.field{margin:0 0 13px}label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#182230}input{width:100%;padding:11px 12px;border:1px solid #cfd8e6;border-radius:9px;background:#fff;color:#101828;outline:none}input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}button{width:100%;padding:11px 12px;border:0;border-radius:9px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px;box-shadow:0 5px 14px rgba(37,99,235,.18)}button:hover{filter:brightness(1.03)}button:disabled{opacity:.6;cursor:wait;box-shadow:none}.disconnect{background:#fff;color:#b42318;border:1px solid #f0b9b3;box-shadow:none}.secondary{background:#eef2f7;color:#182230;box-shadow:none}.register-line{margin:11px 0 2px;text-align:center;font-size:12px;color:var(--muted)}.register-line a{color:#2563eb;font-weight:800;text-decoration:none}.connection-card{padding:13px;border:1px solid #b7e4d3;border-radius:12px;background:linear-gradient(180deg,#f0fdf7,#fff);margin-bottom:13px}.connection-top{display:flex;align-items:center;gap:9px}.check{width:28px;height:28px;border-radius:50%;background:#d1fae5;color:#047857;display:flex;align-items:center;justify-content:center;font-weight:900}.connected-label{font-size:12px;color:#047857;font-weight:800}.username{font-size:15px;font-weight:800;margin-top:2px;color:#101828;word-break:break-word}.email{font-size:11px;color:#667085;margin-top:2px;word-break:break-word}.preview{margin-top:12px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.4}.stats{color:#667085;margin-top:4px}.status{margin-top:11px;font-size:12px;line-height:1.45;white-space:pre-wrap}.connected-text{color:#047857;font-weight:800}.notconnected{color:#b42318;font-weight:700}.hidden{display:none!important}.divider{margin:14px 0 8px;font-size:10px;color:#98a2b3;text-align:center;text-transform:uppercase;letter-spacing:.08em}.footer{font-size:10px;color:#98a2b3;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="header"><div class="brand"><div class="brand-mark"><img src="logo.png" alt="ELMS"></div><div class="brand-title">ELMS Amazon Importer</div></div><p>Import the product currently open on Amazon directly into your ELMS Drafts.</p></div>
<div class="body">
  <div id="connectedCard" class="connection-card hidden">
    <div class="connection-top"><div class="check">✓</div><div><div class="connected-label">CONNECTED SUCCESSFULLY</div><div id="connectedUsername" class="username">ELMS Account</div><div id="connectedEmail" class="email"></div></div></div>
  </div>
  <div id="keySection">
    <div class="field"><label>ELMS Extension Key</label><input id="extensionKey" type="password" autocomplete="off" placeholder="Paste your ELMS Extension Key"></div>
    <button id="connect">Connect ELMS Account</button>
    <div class="register-line">Don’t have an ELMS account? <a id="registerLink" href="#">Register now</a></div>
  </div>
  <div class="field"><label>Markup % (optional)</label><input id="markup" type="number" step="0.01" min="0" placeholder="0"></div>
  <button id="disconnect" class="disconnect hidden">Disconnect ELMS</button>
  <button id="import">Import current Amazon product</button>
  <div id="preview" class="preview hidden"></div>
  <div id="status" class="status"></div>
  <div class="footer">ELMS • Amazon → eBay Drafts</div>
</div>
<script src="popup.js"></script>
</body>
</html>
